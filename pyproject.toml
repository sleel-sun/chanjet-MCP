[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chanjet-tcloud-mcp"
version = "0.1.1"
description = "MCP server for Chanjet T+Cloud, HYC/ZPlus, HSY, YDZ/Finance, and HKJ/Accounting OpenAPI documentation and API calls"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
chanjet-mcp = "chanjet_tcloud_mcp.server:main"
chanjet-tcloud-mcp = "chanjet_tcloud_mcp.server:main"
hyc-mcp = "chanjet_tcloud_mcp.server:main"
hsy-mcp = "chanjet_tcloud_mcp.server:main"
ydz-mcp = "chanjet_tcloud_mcp.server:main"
hkj-mcp = "chanjet_tcloud_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
