[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chanjet-tcloud-mcp"
version = "0.1.0"
description = "MCP server for Chanjet T+Cloud OpenAPI documentation and API calls"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
chanjet-tcloud-mcp = "chanjet_tcloud_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

