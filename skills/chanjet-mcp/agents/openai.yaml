interface:
  display_name: "Chanjet MCP"
  short_description: "Use Changjie business API MCP tools."
  default_prompt: "Use $chanjet-mcp with the configured Chanjet MCP server to handle this business API request."

dependencies:
  tools:
    - type: "mcp"
      value: "chanjet-mcp"
      description: "Any configured Chanjet MCP server exposing T+, HYC, HSY, YDZ, and HKJ business API tools."

policy:
  allow_implicit_invocation: true
  direct_tools:
    - "call_natural"
    - "call_api_smart"
    - "search_api_templates"
    - "call_api_template"
    - "query_tplus_voucher_list_smart"
    - "call_tplus_api_smart"
